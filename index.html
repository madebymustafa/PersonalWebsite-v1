<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="mustafa.design — coming soon. A senior product designer's portfolio." />
  <meta name="theme-color" content="#202020" />
  <title>mustafa.design — Coming Soon</title>

  <!-- Clash Display (display typeface via Fontshare CDN) -->
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="section">
    <div class="wrapper">

      <!-- loader reveal -->
      <div class="reveal"></div>

      <!-- background grid lines -->
      <div class="bg-lines"></div>

      <!-- logo -->
      <div class="logo">mustafa<span class="logo__sep">.</span></div>

      <div class="content-wrapper">

        <!-- main centered image (static centerpiece behind the heading) -->
        <img
          class="main-img"
          src="assets/images/img1.webp"
          alt=""
        />

        <!-- desktop content -->
        <div class="content">
          <h1 class="h-coming-soon" aria-label="Coming soon">COMING&nbsp;SOON</h1>

          <img class="content__img" src="assets/images/img2.webp" alt="" />
          <img class="content__img" src="assets/images/img3.webp" alt="" />
          <img class="content__img" src="assets/images/img4.webp" alt="" />
          <img class="content__img" src="assets/images/img5.webp" alt="" />
          <img class="content__img" src="assets/images/img6.webp" alt="" />
          <!-- NB: IMG1 is intentionally NOT repeated here — it lives once as
               the standalone .main-img, which is itself part of the trail cluster,
               so the same image won't show twice when the cluster activates. -->
        </div>

        <!-- mobile content -->
        <div class="mobile-content">
          <h1 class="h-coming-soon mobile" aria-label="Coming soon">COMING&nbsp;SOON</h1>
          <img class="img-mobile" src="assets/images/img6.webp" alt="" />
          <img class="img-mobile" src="assets/images/img5.webp" alt="" />
          <img class="img-mobile" src="assets/images/img4.webp" alt="" />
          <img class="img-mobile" src="assets/images/img3.webp" alt="" />
          <img class="img-mobile" src="assets/images/img2.webp" alt="" />
          <img class="img-mobile" src="assets/images/img1.webp" alt="" />
        </div>
      </div>

      <!-- bottom block: social strip + outlined kinetic marquee -->
      <div class="bottom">
        <div class="social">
          <a class="social__link" href="https://www.linkedin.com/in/madebymustafa/" target="_blank" rel="noopener">
            <span class="social__label">LinkedIn</span>
            <span class="social__arrow" aria-hidden="true">&nearr;</span>
          </a>
          <a class="social__link" href="https://github.com/madebymustafa" target="_blank" rel="noopener">
            <span class="social__label">GitHub</span>
            <span class="social__arrow" aria-hidden="true">&nearr;</span>
          </a>
          <a class="social__link" href="mailto:hi.mustafa@icloud.com">
            <span class="social__label">Mail</span>
            <span class="social__arrow" aria-hidden="true">&nearr;</span>
          </a>
        </div>

        <div class="marquee">
          <div class="track">
            <span class="marquee-text">mustafa.design</span>
            <span class="marquee-sep" aria-hidden="true">✦</span>
            <span class="marquee-text">mustafa.design</span>
            <span class="marquee-sep" aria-hidden="true">✦</span>
            <span class="marquee-text">mustafa.design</span>
            <span class="marquee-sep" aria-hidden="true">✦</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
